

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TATUAJES - SLAG ART</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <h2>MI TRABAJO EN SLAG TATTOO</h2>

    <p>Conoce nuestro trabajo y calidad en cada tatuaje.</p>

    <div class="video-contenedor">
        <video controls>
            <source src="videos/tatuando.mp4.mp4" type="video/mp4">
        </video>
    </div>

    <h2>ESTILOS DE TATUAJES - SLAG</h2>
    <h2>NUESTROS ESTILOS</h2>

    <label for="estiloTatuaje">Selecciona un estilo:</label>

    <select id="estiloTatuaje">
        <option value="">Selecciona un estilo</option>
        <option value="blackwork">Blackwork</option>
        <option value="lettering">Lettering</option>
        <option value="realismo">Realismo</option>
        <option value="tribal">Tribal</option>
        <option value="oldschool">Old School</option>
        <option value="fineline">Fine Line</option>
    </select>

    <button type="button" id="btnEstilo">Ver estilo</button>

    <p id="resultadoEstilo"></p>

    <div class="galeria">

        <div>
            <h3>Blackwork</h3>
            <div class="diseno-tatuaje">
                <img src="Imagenes/black.png" alt="Blackwork">
                <img src="Imagenes/black1.png" alt="Blackwork">
                <img src="Imagenes/black2.png" alt="Blackwork">
                <img src="Imagenes/black3.png" alt="Blackwork">
                <img src="Imagenes/black4.png" alt="Blackwork">
                <img src="Imagenes/black5.png" alt="Blackwork">

                <button type="button" class="btn-me-gusta" onclick="darMeGusta(this)">
                    ❤️ Me gusta <span>0</span>
                </button>
            </div>
        </div>

        <div>
            <h3>Lettering</h3>
            <div class="diseno-tatuaje">
                <img src="Imagenes/lettering.png" alt="Lettering">
                <img src="Imagenes/let1.png" alt="Lettering">
                <img src="Imagenes/let2.png" alt="Lettering">
                <img src="Imagenes/let3.png" alt="Lettering">
                <img src="Imagenes/let4.png" alt="Lettering">
                <img src="Imagenes/let5.png" alt="Lettering">

                <button type="button" class="btn-me-gusta" onclick="darMeGusta(this)">
                    ❤️ Me gusta <span>0</span>
                </button>
            </div>
        </div>

        <div>
            <h3>Realismo</h3>
            <div class="diseno-tatuaje">
                <img src="Imagenes/realismo.png" alt="Realismo">
                <img src="Imagenes/realismo1.png" alt="Realismo">
                <img src="Imagenes/realismo2.png" alt="Realismo">
                <img src="Imagenes/realismo3.png" alt="Realismo">
                <img src="Imagenes/realismo4.png" alt="Realismo">
                <img src="Imagenes/realimo5.png" alt="Realismo">

                <button type="button" class="btn-me-gusta" onclick="darMeGusta(this)">
                    ❤️ Me gusta <span>0</span>
                </button>
            </div>
        </div>

    </div>

    <a href="inicio.html">Volver al inicio</a>

    <script src="js/script.js"></script>

</body>
</html>
